name: game-ai-digest

on:
  schedule:
    # 오전 KST 07:13~11:43, 30분 간격. 10시대에 누적 10건을 목표로
    # 하고 11시대에는 누락·후보 부족분을 재시도한다 (UTC는 전날 포함).
    - cron: "13,43 22,23,0,1,2 * * *"
    # 오후는 기존 KST 12:53/14:23/15:53/17:23/18:53/20:23/21:53 유지.
    - cron: "23 5,8,11 * * *"
    - cron: "53 3,6,9,12 * * *"
  workflow_dispatch:
    inputs:
      collect_feedback_only:
        description: "익명 반응만 수집하고 통계 출력 (뉴스·광고 발송 없음)"
        required: false
        type: boolean
        default: false
      publish_geeknews_url:
        description: "긱뉴스 피드의 특정 기사 URL 1건 게시 (발송 기록 반영, 광고 없음)"
        required: false
        type: string
        default: ""
      send_promo_now:
        description: "다음 자매 채널 홍보만 즉시 발송"
        required: false
        type: boolean
        default: false
      send_channel_guide_now:
        description: "고정용 채널 안내를 상태 변경 없이 즉시 발송"
        required: false
        type: boolean
        default: false
      preview_send:
        description: "콘솔 미리보기만 출력 (텔레그램 전송 없음)"
        required: false
        type: boolean
        default: false
      preview_limit:
        description: "콘솔 미리보기 기사 수"
        required: false
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "10"
        default: "1"

concurrency:
  group: game-ai-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

      - name: Collect and send digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SEND_PROMO_NOW: ${{ inputs.send_promo_now || 'false' }}
          SEND_CHANNEL_GUIDE_NOW: ${{ inputs.send_channel_guide_now || 'false' }}
          PREVIEW_SEND: ${{ inputs.preview_send || 'false' }}
          PREVIEW_LIMIT: ${{ inputs.preview_limit || '1' }}
          PUBLISH_GEEKNEWS_URL: ${{ inputs.publish_geeknews_url || '' }}
          COLLECT_FEEDBACK_ONLY: ${{ inputs.collect_feedback_only || 'false' }}
        run: |
          if [ "$PREVIEW_SEND" = "true" ]; then
            python main.py --dry-run --show-all --limit "$PREVIEW_LIMIT" --no-promo
          elif [ "$COLLECT_FEEDBACK_ONLY" = "true" ]; then
            python main.py --collect-feedback
          elif [ -n "$PUBLISH_GEEKNEWS_URL" ]; then
            python main.py --source geeknews --article-url "$PUBLISH_GEEKNEWS_URL" --limit 1 --no-promo
          elif [ "$SEND_CHANNEL_GUIDE_NOW" = "true" ]; then
            python main.py --send-channel-guide
          elif [ "$SEND_PROMO_NOW" = "true" ]; then
            python main.py --send-promo-now
          else
            python main.py
          fi

      - name: Feedback statistics (no network or delivery)
        if: always()
        run: python main.py --feedback-report

      - name: Commit read state
        # 여러 게시물 중 일부만 성공한 경우에도 성공분의 상태를 보존해 중복 발송을 막는다.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/news_state.json
          if ! git diff --cached --quiet; then
            git commit -m "상태 업데이트"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep 5
            done
            exit 1
          fi
