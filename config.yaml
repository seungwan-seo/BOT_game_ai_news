digest:
  title: "게임 AI 뉴스"
  timezone: "Asia/Seoul"
  daily_post_limit: 20
  max_items_per_run: 1
  # 오전 누적 10건을 먼저 채우고, 오후에는 기존처럼 회차당 1건씩 발행한다.
  morning_target:
    enabled: true
    count: 10
    deadline_hour: 12
    end_hour: 22
    milestones:
      - time: "07:00"
        count: 3
      - time: "08:30"
        count: 6
      - time: "10:00"
        count: 10
  max_items_per_source: 2
  freshness_days: 4
  max_description_chars: 2200

http:
  timeout_seconds: 25
  delay_seconds: 0.6
  user_agent: "game-ai-news-bot/0.1 (+personal RSS reader; contact via repository)"

# 선택된 영문 제목과 짧은 발췌를 무료 MyMemory API로 한국어 번역한다.
# 실패해도 영문 원제를 보존하고 브리핑 발송은 계속한다.
translation:
  enabled: true
  timeout_seconds: 12

# 채널의 익명 👍/👎 집계만 수집한다. 뉴스 선별 반영은 표본 검토 후 수동 활성화.
feedback:
  enabled: true
  apply_to_ranking: false
  window_hours: 48
  lookback_days: 30
  min_posts: 5
  min_reacted_posts: 3
  min_reactions: 20
  prior_reactions: 10
  max_adjustment: 3
  timeout_seconds: 15

# 공지 고정용 채널 안내. 가격·리뷰처럼 변하는 수치는 넣지 않는다.
channel_guide:
  steam_channel_url: "https://t.me/steam_deals_free"
  turtle_url: "https://store.steampowered.com/app/3952050/Turtle_Game/"
  image_url: "https://cdn.akamai.steamstatic.com/steam/apps/3952050/header.jpg"

# 정상 뉴스가 게시되는 날 중 마지막 홍보 후 지정 일수가 지났을 때 1건을 덧붙인다.
# 채널이 늘어나면 channels에 추가하며 promotion_cursor 순서로 하나씩 순환한다.
promotion:
  enabled: true
  interval_days: 5
  channels:
    - name: "🎁 Steam Deals · Free Games"
      url: "https://t.me/steam_deals_free"
      description: "무료 배포, 높은 할인율, 신작과 숨은 인디 게임을 자동으로 선별하는 글로벌 영문 채널입니다."

# trusted=true는 해당 사이트 전체가 게임 AI 전용이라는 뜻이다.
# 일반 기술/게임 피드는 관련성 점수가 min_relevance 이상인 글만 남긴다.
sources:
  - id: geeknews
    name: "GeekNews · 긱뉴스"
    kind: rss
    url: "https://news.hada.io/rss/news"
    editorial_filter: geeknews
    language: ko
    source_weight: 8
    perspective: community
    max_items_per_day: 2

  - id: ai_and_games
    name: "AI and Games"
    kind: rss
    url: "https://www.aiandgames.com/feed"
    trusted: true
    source_weight: 10
    perspective: independent

  - id: games_and_ai
    name: "Games and AI"
    kind: rss
    url: "https://www.gamesandai.org/feed"
    trusted: true
    source_weight: 8
    perspective: independent

  - id: game_developer
    name: "Game Developer"
    kind: rss
    url: "https://www.gamedeveloper.com/rss.xml"
    min_relevance: 6
    source_weight: 9
    perspective: journalism

  - id: videogames_industry_memo
    name: "Video Games Industry Memo"
    kind: rss
    url: "https://www.videogamesindustrymemo.com/feed"
    min_relevance: 7
    source_weight: 7
    perspective: journalism

  - id: deepmind
    name: "Google DeepMind"
    kind: rss
    url: "https://deepmind.google/blog/rss.xml"
    min_relevance: 7
    source_weight: 8
    perspective: vendor

  - id: nvidia_developer
    name: "NVIDIA Developer Blog"
    kind: rss
    url: "https://developer.nvidia.com/blog/feed/"
    min_relevance: 7
    source_weight: 7
    perspective: vendor

  - id: inworld
    name: "Inworld"
    kind: rss
    url: "https://inworld.ai/blog/rss.xml"
    min_relevance: 5
    source_weight: 5
    perspective: vendor

  - id: unreal_engine
    name: "Unreal Engine"
    kind: rss
    url: "https://www.unrealengine.com/rss?lang=en-US"
    min_relevance: 7
    source_weight: 7
    perspective: vendor

  - id: krafton_ai
    name: "KRAFTON AI"
    kind: krafton_blog
    url: "https://www.krafton.ai/blog/"
    min_relevance: 5
    source_weight: 8
    perspective: vendor

  - id: microsoft_game_intelligence
    name: "Microsoft Research Game Intelligence"
    kind: html
    url: "https://www.microsoft.com/en-us/research/group/game-intelligence/"
    link_pattern: "^https://www\\.microsoft\\.com/en-us/research/(project|blog|publication|podcast)/.+"
    trusted: true
    require_date: true
    source_weight: 8
    perspective: research

  - id: ubisoft_laforge
    name: "Ubisoft La Forge"
    kind: html
    # 목록이 현재 클라이언트 렌더링이라 안정적인 링크가 서버 HTML에 돌아올 때 활성화한다.
    enabled: false
    url: "https://www.ubisoft.com/en-us/studio/laforge/news"
    link_pattern: "^https://www\\.ubisoft\\.com/en-us/studio/laforge/news/.+"
    min_relevance: 5
    source_weight: 7
    perspective: research

  - id: arxiv_game_ai
    name: "arXiv Game AI"
    kind: arxiv
    query: '(all:"video game" OR all:"game AI" OR all:"game agent" OR all:"procedural content generation") AND (cat:cs.AI OR cat:cs.LG OR cat:cs.HC)'
    max_results: 35
    min_relevance: 6
    source_weight: 7
    perspective: research

